// Versao 3 da linguagem Protocol Buffers.
syntax = "proto3";

// Namespace do contrato. Aparece no nome totalmente qualificado do servico:
// restaurante.RestauranteService
package restaurante;

// =============================================================================
// SERVICO
// Contrato que o servidor (restaurante, na VM do GCP) implementa e que o
// cliente (terminal local) consome. Os stubs Python dos dois lados sao gerados
// a partir deste arquivo por scripts/gerar_stubs.py.
// =============================================================================
service RestauranteService {
  // RPC unario: o cliente pede o cardapio e recebe uma unica resposta.
  rpc ObterCardapio(ObterCardapioRequest) returns (ObterCardapioResponse);

  // RPC unario: o cliente envia os itens e as quantidades do pedido e recebe
  // a confirmacao com o total calculado pelo servidor.
  rpc CriarPedido(CriarPedidoRequest) returns (CriarPedidoResponse);

  // RPC de streaming do servidor: uma requisicao, varias respostas. O servidor
  // envia cada mudanca de status do pedido pela mesma conexao ate a entrega.
  rpc AcompanharPedido(AcompanharPedidoRequest) returns (stream StatusPedido);
}

// =============================================================================
// CARDAPIO
// =============================================================================

// Requisicao do cardapio. Categoria vazia significa "cardapio completo".
message ObterCardapioRequest {
  string categoria = 1;
}

// Um item vendido pelo restaurante.
message ItemCardapio {
  // Os numeros identificam os campos na serializacao binaria do Protobuf.
  string codigo = 1;      // codigo curto digitado pelo cliente, ex: "PR01"
  string nome = 2;
  string descricao = 3;
  string categoria = 4;   // Entradas, Pratos, Bebidas, Sobremesas
  double preco = 5;       // em reais
  bool disponivel = 6;    // false = item existe no cardapio mas esgotou hoje
}

// Cardapio devolvido pelo servidor.
message ObterCardapioResponse {
  string restaurante = 1;
  // repeated = lista. Cada elemento e serializado com a mesma tag de campo.
  repeated ItemCardapio itens = 2;
}

// =============================================================================
// PEDIDO
// =============================================================================

// Uma linha do pedido: qual item e quantas unidades.
message ItemPedido {
  string codigo = 1;
  int32 quantidade = 2;
}

// Pedido enviado pelo cliente.
message CriarPedidoRequest {
  string cliente = 1;
  string endereco = 2;
  repeated ItemPedido itens = 3;
}

// Linha do pedido ja validada e precificada pelo servidor.
message ItemConfirmado {
  string codigo = 1;
  string nome = 2;
  int32 quantidade = 3;
  double preco_unitario = 4;
  double subtotal = 5;
}

// Confirmacao devolvida pelo servidor apos criar o pedido.
message CriarPedidoResponse {
  string pedido_id = 1;                // UUID gerado pelo servidor
  StatusPedidoEnum status = 2;
  repeated ItemConfirmado itens = 3;
  double total = 4;                    // sempre calculado no servidor
  int32 tempo_estimado_minutos = 5;
  string mensagem = 6;
}

// =============================================================================
// ACOMPANHAMENTO
// =============================================================================

// Estados possiveis de um pedido. O valor 0 e obrigatorio em proto3 e
// representa "nao informado".
enum StatusPedidoEnum {
  STATUS_DESCONHECIDO = 0;
  RECEBIDO = 1;
  EM_PREPARO = 2;
  PRONTO = 3;
  SAIU_PARA_ENTREGA = 4;
  ENTREGUE = 5;
}

// Requisicao de acompanhamento de um pedido ja criado.
message AcompanharPedidoRequest {
  string pedido_id = 1;
}

// Cada atualizacao enviada pelo stream de acompanhamento.
message StatusPedido {
  string pedido_id = 1;
  StatusPedidoEnum status = 2;
  string descricao = 3;   // texto amigavel para o terminal do cliente
  string horario = 4;     // HH:MM:SS do momento da atualizacao
}
