# Delivery Hell's Kitchen - Frontend + API Gateway + 3 microsservicos gRPC + PostgreSQL.
#
# Cada componente tem a sua imagem, construida por um Dockerfile multi-stage:
#   docker/microsservico.Dockerfile  usuarios, catalogo, pedidos (ARG SERVICO)
#   docker/gateway.Dockerfile        API Gateway FastAPI
#   docker/migrador.Dockerfile       schema + seed do banco (roda e termina)
#   frontend/Dockerfile              React servido pelo nginx sem root
#
# Profiles (variavel COMPOSE_PROFILES no .env, ver .env.exemplo):
#   banco-local  PostgreSQL em container
#   servicos     migrador + usuarios + catalogo + pedidos
#   gateway      API Gateway
#   frontend     React no nginx
#
#   No seu computador, tudo junto:  COMPOSE_PROFILES=banco-local,servicos,gateway,frontend
#
# Os servicos de profiles diferentes podem rodar em maquinas diferentes, por isso
# nao ha depends_on entre eles: o Gateway responde 503 (e o circuit breaker abre)
# enquanto um microsservico nao esta no ar, e os microsservicos esperam o banco.
#
# Tolerancia a falhas (ver docs/07-resiliencia.md):
#   docker compose stop catalogo     derruba o Catalogo de verdade
#   CATALOGO_FALHA_PERCENTUAL=50     no .env + `docker compose up -d catalogo`:
#                                    metade das chamadas falha de proposito
#   CATALOGO_FALHA_ATRASO_MS=6000    idem, mas cada chamada demora 6 s (timeout)

x-banco: &banco
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-delivery}"
  DB_USER: "${DB_USER:-postgres}"
  DB_PASSWORD: "${DB_PASSWORD:-postgres}"
  DB_SSLMODE: "${DB_SSLMODE:-disable}"
  TZ: "America/Sao_Paulo"

# Parametros do retry e do circuit breaker de quem chama outro servico
# (Gateway e Pedidos). Os padroes valem para a demonstracao.
x-resiliencia: &resiliencia
  GRPC_TIMEOUT: "${GRPC_TIMEOUT:-5}"
  GRPC_PRAZO_TOTAL: "${GRPC_PRAZO_TOTAL:-12}"
  RETRY_TENTATIVAS: "${RETRY_TENTATIVAS:-3}"
  DISJUNTOR_FALHAS: "${DISJUNTOR_FALHAS:-3}"
  DISJUNTOR_ABERTO_SEGUNDOS: "${DISJUNTOR_ABERTO_SEGUNDOS:-15}"

x-imagem-servico: &imagem-servico
  context: .
  dockerfile: docker/microsservico.Dockerfile

services:
  postgres:
    image: postgres:16
    profiles: ["banco-local"]
    container_name: delivery-postgres
    environment:
      POSTGRES_DB: "${DB_NAME:-delivery}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      TZ: "America/Sao_Paulo"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  # ---------------------------------------------------------------- servicos
  migrador:
    build:
      context: .
      dockerfile: docker/migrador.Dockerfile
    profiles: ["servicos"]
    container_name: delivery-migrador
    environment:
      <<: *banco
      # Usuario da cozinha: senha so no .env da maquina, nunca no repositorio.
      DEMO_LOGIN: "${DEMO_LOGIN:-professor}"
      DEMO_SENHA: "${DEMO_SENHA:-}"
    restart: on-failure

  usuarios:
    build:
      <<: *imagem-servico
      args:
        SERVICO: usuarios
    profiles: ["servicos"]
    container_name: delivery-usuarios
    environment:
      <<: *banco
      PORTA: "9092"
      FALHA_PERCENTUAL: "${USUARIOS_FALHA_PERCENTUAL:-0}"
      FALHA_ATRASO_MS: "${USUARIOS_FALHA_ATRASO_MS:-0}"
    # Portas gRPC so em 127.0.0.1 por padrao: da para usar o grpcurl na propria
    # maquina, mas nada na rede alcanca os microsservicos.
    ports:
      - "${GRPC_BIND:-127.0.0.1}:9092:9092"
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: always

  catalogo:
    build:
      <<: *imagem-servico
      args:
        SERVICO: catalogo
    profiles: ["servicos"]
    container_name: delivery-catalogo
    environment:
      <<: *banco
      PORTA: "9091"
      FALHA_PERCENTUAL: "${CATALOGO_FALHA_PERCENTUAL:-0}"
      FALHA_ATRASO_MS: "${CATALOGO_FALHA_ATRASO_MS:-0}"
    ports:
      - "${GRPC_BIND:-127.0.0.1}:9091:9091"
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: always

  pedidos:
    build:
      <<: *imagem-servico
      args:
        SERVICO: pedidos
    profiles: ["servicos"]
    container_name: delivery-pedidos
    environment:
      <<: [*banco, *resiliencia]
      PORTA: "9090"
      FALHA_PERCENTUAL: "${PEDIDOS_FALHA_PERCENTUAL:-0}"
      FALHA_ATRASO_MS: "${PEDIDOS_FALHA_ATRASO_MS:-0}"
      # Pedidos -> Catalogo pela rede interna do compose.
      CATALOGO_HOST: catalogo
      CATALOGO_PORTA: "9091"
    ports:
      - "${GRPC_BIND:-127.0.0.1}:9090:9090"
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: always

  # ----------------------------------------------------------------- gateway
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    profiles: ["gateway"]
    container_name: delivery-gateway
    environment:
      <<: *resiliencia
      USUARIOS_HOST: "${USUARIOS_HOST:-usuarios}"
      USUARIOS_PORTA: "${USUARIOS_PORTA:-9092}"
      CATALOGO_HOST: "${CATALOGO_HOST:-catalogo}"
      CATALOGO_PORTA: "${CATALOGO_PORTA:-9091}"
      PEDIDOS_HOST: "${PEDIDOS_HOST:-pedidos}"
      PEDIDOS_PORTA: "${PEDIDOS_PORTA:-9090}"
      JWT_SEGREDO: "${JWT_SEGREDO:-}"
      JWT_EXPIRACAO_MINUTOS: "${JWT_EXPIRACAO_MINUTOS:-60}"
      CORS_ORIGENS: "${CORS_ORIGENS:-*}"
      TZ: "America/Sao_Paulo"
    ports:
      - "8000:8000"
    restart: always

  # ---------------------------------------------------------------- frontend
  frontend:
    build: ./frontend
    profiles: ["frontend"]
    container_name: delivery-frontend
    environment:
      # Endereco do Gateway que o navegador vai chamar (entregue em /config.js).
      API_URL: "${API_URL:-http://localhost:8000}"
    ports:
      - "${FRONTEND_PORTA:-80}:8080"
    restart: always

volumes:
  dados-postgres:
