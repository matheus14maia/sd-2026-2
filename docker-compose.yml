# Delivery Hell's Kitchen - Frontend + API Gateway + 3 microsservicos gRPC + PostgreSQL.
#
# Cada maquina sobe so a sua parte, escolhida pelo profile (variavel
# COMPOSE_PROFILES no arquivo .env de cada maquina, ver .env.exemplo):
#
#   servicos     migrador + usuarios + catalogo + pedidos   (VM servidor-delivery)
#   gateway      API Gateway FastAPI                        (VM delivery-gateway)
#   frontend     React servido pelo nginx                   (VM delivery-frontend)
#   banco-local  PostgreSQL em container                    (so na maquina local)
#
#   Local, tudo junto:  COMPOSE_PROFILES=banco-local,servicos,gateway,frontend
#   Em cada VM:         docker compose up -d --build   (o .env define o profile)
#
# Os servicos de profiles diferentes rodam em maquinas diferentes, por isso nao
# ha depends_on entre eles: o Gateway responde 503 enquanto um microsservico
# nao esta no ar, e os microsservicos esperam o banco em codigo.

x-banco: &banco
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-delivery}"
  DB_USER: "${DB_USER:-postgres}"
  DB_PASSWORD: "${DB_PASSWORD:-postgres}"
  DB_SSLMODE: "${DB_SSLMODE:-disable}"
  TZ: "America/Sao_Paulo"

services:
  postgres:
    image: postgres:16
    profiles: ["banco-local"]
    container_name: delivery-postgres
    environment:
      POSTGRES_DB: "${DB_NAME:-delivery}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      TZ: "America/Sao_Paulo"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    restart: always

  # ---------------------------------------------------------------- servicos
  migrador:
    build: .
    profiles: ["servicos"]
    container_name: delivery-migrador
    command: python scripts/migrar_banco.py
    environment:
      <<: *banco
      NOME_SERVICO: migrador
    restart: on-failure

  usuarios:
    build: .
    profiles: ["servicos"]
    container_name: delivery-usuarios
    command: python -m src.usuarios.servidor
    environment:
      <<: *banco
      NOME_SERVICO: usuarios
      PORTA: "9092"
    # Portas gRPC: so 127.0.0.1 por padrao. Na VM dos microsservicos o .env
    # define GRPC_BIND=0.0.0.0 para o Gateway (outra VM) alcancar, e o firewall
    # do GCP so libera 9090-9092 para a VM do Gateway (tag delivery-gateway).
    ports:
      - "${GRPC_BIND:-127.0.0.1}:9092:9092"
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: always

  catalogo:
    build: .
    profiles: ["servicos"]
    container_name: delivery-catalogo
    command: python -m src.catalogo.servidor
    environment:
      <<: *banco
      NOME_SERVICO: catalogo
      PORTA: "9091"
    ports:
      - "${GRPC_BIND:-127.0.0.1}:9091:9091"
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: always

  pedidos:
    build: .
    profiles: ["servicos"]
    container_name: delivery-pedidos
    command: python -m src.pedidos.servidor
    environment:
      <<: *banco
      NOME_SERVICO: pedidos
      PORTA: "9090"
      # Pedidos -> Catalogo fica na mesma maquina: rede interna do compose.
      CATALOGO_HOST: catalogo
      CATALOGO_PORTA: "9091"
    ports:
      - "${GRPC_BIND:-127.0.0.1}:9090:9090"
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: always

  # ----------------------------------------------------------------- gateway
  gateway:
    build: .
    profiles: ["gateway"]
    container_name: delivery-gateway
    command: uvicorn src.gateway.app:app --host 0.0.0.0 --port 8000
    environment:
      # Local: nomes dos containers. GCP: nome DNS interno da VM servidor-delivery.
      USUARIOS_HOST: "${USUARIOS_HOST:-usuarios}"
      USUARIOS_PORTA: "9092"
      CATALOGO_HOST: "${CATALOGO_HOST:-catalogo}"
      CATALOGO_PORTA: "9091"
      PEDIDOS_HOST: "${PEDIDOS_HOST:-pedidos}"
      PEDIDOS_PORTA: "9090"
      JWT_SEGREDO: "${JWT_SEGREDO:-}"
      JWT_EXPIRACAO_MINUTOS: "${JWT_EXPIRACAO_MINUTOS:-60}"
      CORS_ORIGENS: "${CORS_ORIGENS:-*}"
      TZ: "America/Sao_Paulo"
    ports:
      - "8000:8000"
    restart: always

  # ---------------------------------------------------------------- frontend
  frontend:
    build: ./frontend
    profiles: ["frontend"]
    container_name: delivery-frontend
    environment:
      # Endereco do Gateway que o navegador vai chamar (entregue em /config.js).
      API_URL: "${API_URL:-http://localhost:8000}"
    ports:
      - "${FRONTEND_PORTA:-80}:80"
    restart: always

volumes:
  dados-postgres:
